<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تم تأكيد البريد | راعي</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fbf6ee;
      font-family: Arial, Tahoma, sans-serif;
      color: #2d2522;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 42px 30px;
      background: #fffaf4;
      border: 1px solid #eadccc;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(80, 45, 25, 0.08);
    }

    .brand {
      margin-bottom: 24px;
      font-size: 44px;
      font-weight: 700;
      color: #8b1e1e;
    }

    .cross {
      color: #b88945;
    }

    .success {
      width: 64px;
      height: 64px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #eef6ed;
      color: #397348;
      font-size: 32px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 14px;
      color: #8b1e1e;
      font-size: 25px;
    }

    .arabic {
      margin: 0;
      font-size: 17px;
      line-height: 1.9;
    }

    .divider {
      width: 55px;
      height: 2px;
      margin: 25px auto;
      background: #d5b176;
    }

    .english {
      direction: ltr;
      margin: 0;
      color: #776c65;
      font-size: 14px;
      line-height: 1.7;
    }

    .footer {
      margin-top: 28px;
      color: #a0968e;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">
      <span class="cross">†</span> راعي
    </div>

    <div class="success">✓</div>

    <h1>تم تأكيد البريد الإلكتروني</h1>

    <p class="arabic">
      تم تأكيد بريدك الإلكتروني بنجاح.<br>
      يمكنك الآن العودة إلى تطبيق راعي وتسجيل الدخول.
    </p>

    <div class="divider"></div>

    <p class="english">
      Your email has been verified successfully.<br>
      You can now return to Rai and sign in.
    </p>

    <div class="footer">
      راعي
    </div>
  </main>
</body>
</html>
